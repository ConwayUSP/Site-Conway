name: Otimizar fotos dos membros

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Aplicar alterações no Notion
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: optimize-member-photos
  cancel-in-progress: false

jobs:
  optimize:
    name: Otimizar fotos
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Instalar dependências
        run: python -m pip install -r scripts/requirements.txt

      - name: Simular otimização
        if: ${{ !inputs.apply }}
        run: python scripts/optimize_member_photos.py

      - name: Aplicar otimização
        if: ${{ inputs.apply }}
        run: python scripts/optimize_member_photos.py --apply
